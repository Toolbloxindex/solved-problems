name: Palomar preflight for the arctangent counting bound
on:
  push:
    branches: [palomar/sparsity-of-integral-arctangent-sums]
permissions:
  contents: read
jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@046554302064b2c83c2b924bea6db87fc5900c68
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 046554302064b2c83c2b924bea6db87fc5900c68
      request_id: arctanpow034
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator-sparsity-of-integral-arctangent-sums.json","authorization_relationship":"I have approval from a responsible author or maintainer"}'
