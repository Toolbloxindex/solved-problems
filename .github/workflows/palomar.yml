name: Palomar preflight for moll-signed-real-periods
on:
  push:
    branches: [palomar/moll-signed-real-periods]
permissions:
  contents: read
jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@046554302064b2c83c2b924bea6db87fc5900c68
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 046554302064b2c83c2b924bea6db87fc5900c68
      request_id: mollperiod01
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator-moll-signed-real-periods.json","authorization_relationship":"I have approval from a responsible author or maintainer"}'
