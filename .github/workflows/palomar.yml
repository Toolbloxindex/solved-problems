name: Palomar preflight for type B q-Stirling results
on:
  push:
    branches: [palomar/stirling]
permissions:
  contents: read
jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@046554302064b2c83c2b924bea6db87fc5900c68
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 046554302064b2c83c2b924bea6db87fc5900c68
      request_id: preflightqst
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator-stirling.json","authorization_relationship":"I have approval from a responsible author or maintainer"}'
