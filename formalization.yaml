    framework: Codex
    models: []
    tool_setup: Lean 4 and Mathlib with exact tests of the source coordinates and the rank-index inverse.
  notes: Tomás Correia directed the project. Codex developed the construction, the finite controls and the Lean proof.
fidelity:
  divergences: The exact slice is expressed in tilted coordinates, indexed from zero. Weight coordinates are recovered by differences; successive rows differ by at most two, so the original box bounds hold.
