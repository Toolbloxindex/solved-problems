version: v0.4
project:
  name: Two partial results on the Seacrest–Seacrest graph-grabbing conjecture
  description: Alice and Bob alternately remove a vertex from a finite connected graph,
    keeping the remaining graph connected until it is empty. Each collects the weight
    of each vertex they remove. Alice moves first. Seacrest and Seacrest ask whether
    she can always collect at least half the total nonnegative weight when the graph
    is bipartite and has an even number of vertices. The unrestricted conjecture remains
    open.
  authors:
  - Tomás Correia
  license: MIT
  responsible_maintainers:
  - Tomás Correia
