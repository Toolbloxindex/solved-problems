  authors:
  - César Bautista-Ramos
  location: https://arxiv.org/abs/2511.00334v1
  relationship: adapts
  note: Definition 1 provides the tree for the 70-vertex closure.
- title: Linear recurrences for non-log-concave independence polynomials of trees
  authors:
  - César Bautista-Ramos
  - Carlos Guillén-Galván
  - Paulino Gómez-Salgado
  location: https://arxiv.org/abs/2603.14204v1
  relationship: adapts
  note: Corollaries 4.13 and 4.14 provide the trees for the 312- and 315-vertex closures.
- title: Problem 6.6 on unicyclic closures
  location: https://arxiv.org/html/2603.17114v1#S6
  relationship: background
