version: v0.4
project:
  name: One-edge closures with consecutive breaks in log-concavity
  description: For three explicit unicyclic graphs obtained by adding one edge to a tree,
    the independence polynomial has a unimodal coefficient sequence with strict failures
    of log-concavity at specified indices. The 315-vertex example has three consecutive
    failures. The minimal sizes remain open.
  authors:
  - Tomás Correia
  license: MIT
  responsible_maintainers:
  - Tomás Correia
classification:
  arxiv:
  - math.CO
  msc2020:
  - 05C69
