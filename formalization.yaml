version: v0.4
project:
  name: A sublogarithmic bound for integral arctangent-sum values
  description: Add the angles whose tangents are the integers from 1 to n, then take
    the tangent of the sum. Can the answer be an integer once n reaches five? Amdeberhan,
    Medina and Moll conjectured that it never is. This result limits how often an
    exception could occur. Among the first N indices, the count grows at most like
    the three-quarters power of the logarithm of N. The estimate still allows isolated
    exceptions.
  authors:
  - Tomás Correia
  license: MIT
  responsible_maintainers:
  - Tomás Correia
