version: v0.4
project:
  name: A counterexample to Songsuwan’s Conjecture 2 in Node-Kayles
  description: A fixed connected 291-vertex host with repeated endpoint-rooted five-vertex
    paths has game values 8 and 9 at counts 4j+5 and 4j+7 for every natural j. Hence
    no eventual lag-two equality holds on this host.
  authors:
  - Tomás Correia
  license: MIT
  responsible_maintainers:
