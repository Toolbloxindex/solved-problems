version: v0.4
project:
  name: Log-concavity in the first columns and second diagonal of the type B q-Stirling
    arrays
  description: Strict adjacent log-concavity in second-kind column one has threshold
    rank six for ranks at least two. The first-kind rising-side midpoint inequality
    holds in column one, and both families satisfy the parity inequality on the second
    diagonal. First-kind column one is unimodal with a peak between consecutive triangular numbers.
  authors:
  - Tomás Correia
  license: MIT
  responsible_maintainers:
  - Tomás Correia
classification:
  arxiv:
  - math.CO
  msc2020:
  - 05A15
  - 05A20
sources:
