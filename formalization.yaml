version: v0.4
project:
  name: One-edge closures with consecutive breaks in log-concavity
  description: Count the ways to pick k vertices of a graph with no edges between
    them. As k grows, those counts can go up to a single peak and then drop, yet still
    bend the wrong way compared with their neighbors. Can several such bends survive
    after one extra edge closes a tree into a cycle? Three explicit graphs show that
    they can. The 315-vertex example has three consecutive breaks and still has a
    single peak. This settles the existence question; minimal graph sizes remain open.
  authors:
  - Tomás Correia
  license: MIT
  responsible_maintainers:
  - Tomás Correia
