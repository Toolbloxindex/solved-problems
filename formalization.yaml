  authors:
  - Bruce E. Sagan
  - Joshua P. Swanson
  location: https://users.math.msu.edu/users/bsagan/Papers/Old/qStB-pub.pdf
  relationship: background
  note: Definition 1.5 gives the coefficient recurrences. Conjecture 7.5 asks about
    both parity subsequences in every column.
- title: Strict log-concavity in the first type-B q-Stirling column
  location: https://github.com/Toolbloxindex/solved-problems/tree/v1.0.0/results/first-column
